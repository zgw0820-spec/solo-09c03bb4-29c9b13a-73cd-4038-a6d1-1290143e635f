services:
  rpki-guard:
    build: .
    image: rpki-cutover-guard:dev
    container_name: rpki-cutover-guard
    # One worker only: route/candidate state is in-process memory.
    init: true
    ports:
      - "8000:8000"
      # RFC 8210 RTR version 1 TCP interface for border routers.
      - "8282:8282"
    environment:
      RPKI_SEED_PATH: /app/data/active_table.json
      RTR_ENABLED: "1"
      RTR_HOST: "0.0.0.0"
      RTR_PORT: "8282"
    volumes:
      # Mount your validator-exported effective table here to replace the
      # bundled seed without rebuilding the image.
      - ./data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: unless-stopped
